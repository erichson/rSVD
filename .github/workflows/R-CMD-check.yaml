name: R-CMD-check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04, r: 'release', matrix-package: 'any::Matrix'}
          - {os: ubuntu-24.04, r: '4.3', matrix-package: 'Matrix@1.6-5'}
          - {os: windows-latest, r: 'release', matrix-package: 'any::Matrix'}
          - {os: macos-latest, r: 'release', matrix-package: 'any::Matrix'}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.config.matrix-package }}
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
