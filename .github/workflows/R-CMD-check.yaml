name: R-CMD-check

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}, Matrix ${{ matrix.config.matrix-version }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-24.04, r: 'release', matrix-version: '1.7-6'}
          - {os: ubuntu-24.04, r: '4.4', matrix-version: '1.7-0'}
          - {os: windows-latest, r: 'release', matrix-version: '1.7-6'}
          - {os: macos-latest, r: 'release', matrix-version: '1.7-6'}
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            Matrix@${{ matrix.config.matrix-version }}
          needs: check
      - name: Verify Matrix version
        shell: Rscript {0}
        run: |
          cat("Testing R", as.character(getRversion()), "with Matrix",
              as.character(packageVersion("Matrix")), "\n")
          stopifnot(packageVersion("Matrix") ==
                    package_version("${{ matrix.config.matrix-version }}"))
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran")'
