name: Sync CRAN 1.0.5 source (one-time)

on:
  push:
    branches: [sync-cran-1.0.5-source]
    paths: ['.github/workflows/sync-cran-source.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Obtain official CRAN release and restore source files
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://cran.r-project.org/src/contrib/rsvd_1.0.5.tar.gz \
            -o /tmp/rsvd_1.0.5.tar.gz
          mkdir -p /tmp/cran-source
          tar -xzf /tmp/rsvd_1.0.5.tar.gz -C /tmp/cran-source
          grep -qx 'Version: 1.0.5' /tmp/cran-source/rsvd/DESCRIPTION
          for path in R man tests NAMESPACE data inst; do
            if [ -e "/tmp/cran-source/rsvd/$path" ]; then
              rm -rf "$path"
              cp -a "/tmp/cran-source/rsvd/$path" "$path"
            fi
          done
          echo 'Source file differences restored from the official CRAN 1.0.5 release:'
          git status --short
          git diff --stat
          echo 'DESCRIPTION is deliberately preserved as version 1.0.6.'
          grep -E '^(Version|Maintainer|Date):' DESCRIPTION
      - name: Commit source parity changes to release review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A R man tests NAMESPACE data inst
          if ! git diff --cached --quiet; then
            git commit -m 'Restore published CRAN 1.0.5 package source baseline'
            git push origin HEAD:sync-cran-1.0.5-source
          else
            echo 'All published source files are already identical.'
          fi
